name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate for a release
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && !inputs.ref }}

jobs:
  quality:
    name: Code, workflows, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - name: Install quality tools
        run: python -m pip install -r requirements/quality.txt
      - name: Check Python correctness
        run: python -m ruff check .
      - name: Validate workflow syntax
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Upload engineering documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-docs
          path: site/
          if-no-files-found: error
          retention-days: 14

  dependency_review:
    name: Review dependency changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  unit_tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      TOKENIZERS_PARALLELISM: "false"
      LLMROUTER_EMBEDDING_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --editable ".[test,routefm]" "torch==2.8.0"
          python -m pip check
      - name: Test routing, CLI, HTTP, and plugin adapters
        run: >-
          python -m pytest
          --disable-socket --allow-unix-socket
          --cov=llmrouter --cov=openclaw_router --cov=custom_routers
          --cov-report=term --cov-report=xml:coverage/core.xml
          --junitxml=test-results/core.xml
      # FusionGate's test bootstrap changes import state. Keep it in its own process.
      - name: Test FusionGate
        run: >-
          python -m pytest custom_routers/fusion_gate/tests
          --disable-socket --allow-unix-socket
          --cov=custom_routers/fusion_gate
          --cov-report=term --cov-report=xml:coverage/fusion.xml
          --junitxml=test-results/fusion.xml
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-python-${{ matrix.python }}
          path: |
            test-results/*.xml
            coverage/*.xml
          retention-days: 14

  package:
    name: Build package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install -r requirements/build.txt
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Verify the installed distribution outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/check_distribution.py" \
            --wheel "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Upload validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, dependency_review, unit_tests, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          EVENT_NAME: ${{ github.event_name }}
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          test "$PACKAGE_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
